<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>芳心居家 個案數據分析</title>
<script src="https://unpkg.com/react@18.2.0/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.js"></script>
<script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://unpkg.com/chart.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Microsoft JhengHei','Noto Sans TC',sans-serif;background:#f8fafc;color:#1e293b}
button,textarea,input{font-family:inherit}
canvas{max-width:100%}
</style>

<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState,useCallback,useMemo,useEffect,useRef}=React;

const PII=new Set(["姓名","身分證字號","居督","主責服務員","服務人員","居所電話","手機","通訊地址","戶籍地址","照管中心案號","案件編號","個案編號","修改者姓名","通訊村里","戶籍村里","通訊路段","戶籍路段","通訊郵遞區號","戶籍郵遞區號","工作經歷","發病前職業"]);
const normN=s=>String(s).replace(/[\s\u3000\u00a0\ufeff]/g,"").trim();

function anonymize(rows){return rows.map(r=>{const o={};Object.keys(r).forEach(k=>{if(!PII.has(k.trim()))o[k.trim()]=r[k];});return o;});}

function parseDate(v){
  if(!v)return null;
  if(v instanceof Date)return isNaN(v)?null:v;
  if(typeof v==="number"){const d=new Date(Math.round((v-25569)*86400*1000));return isNaN(d)?null:d;}
  const d=new Date(String(v).trim().replace(/\//g,"-"));
  return isNaN(d)?null:d;
}
function toYM(d){if(!d)return null;return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;}
function calcAge(v){const d=parseDate(v);if(!d)return null;return new Date().getFullYear()-d.getFullYear();}
function parseCMS(v){
  if(!v)return null;const s=String(v).trim();
  const m=s.match(/(\d+)/);if(m)return m[1];
  const CN={"一":"1","二":"2","三":"3","四":"4","五":"5","六":"6","七":"7","八":"8"};
  for(const[ch,n]of Object.entries(CN))if(s.includes(ch))return n;
  return null;
}

function readXLS(buf){
  const wb=XLSX.read(buf,{type:"array"});
  const ws=wb.Sheets[wb.SheetNames[0]];
  const r1=XLSX.utils.sheet_to_json(ws,{defval:"",range:1});
  const r0=XLSX.utils.sheet_to_json(ws,{defval:""});
  const k1=r1.length>0?Object.keys(r1[0])[0]:"";
  return anonymize((k1&&!k1.startsWith("__EMPTY"))?r1:r0);
}

function computeServiceStats(rows){
  const seen=new Set(),gD={F:0,M:0},gC={F:new Set(),M:new Set()};
  rows.forEach(r=>{
    const name=normN(r["服務個案"]||"");
    const date=String(r["服務日期"]||"").trim();
    const g=String(r["性別"]||"").trim().toUpperCase();
    if(!name||!date)return;
    const key=`${name}__${date}`;
    if(!seen.has(key)){seen.add(key);const gg=g==="F"?"F":g==="M"?"M":null;if(gg){gD[gg]++;gC[gg].add(name);}}
  });
  const total=gD.F+gD.M;
  const totalCases=new Set([...gC.F,...gC.M]).size;
  return{total,totalCases,female:{days:gD.F,cases:gC.F.size},male:{days:gD.M,cases:gC.M.size}};
}

function buildMonthlyActive(allRows){
  const ymSet=new Set();
  allRows.forEach(r=>{
    const om=toYM(parseDate(r["開案日期"]));
    const cm=toYM(parseDate(r["結束(暫停)服務日期"]));
    if(om)ymSet.add(om);if(cm)ymSet.add(cm);
  });
  if(ymSet.size===0)return[];
  const months=Array.from(ymSet).sort();
  const full=[];let cur=new Date(months[0]+"-01");const last=new Date(months[months.length-1]+"-01");
  while(cur<=last){full.push(toYM(cur));cur.setMonth(cur.getMonth()+1);}
  return full.map(ym=>{
    const end=new Date(new Date(ym+"-01").getFullYear(),new Date(ym+"-01").getMonth()+1,0);
    let total=0,male=0,female=0,newCase=0;
    allRows.forEach(r=>{
      const openD=parseDate(r["開案日期"]);const closeD=parseDate(r["結束(暫停)服務日期"]);
      if(toYM(openD)===ym)newCase++;
      if(openD&&openD<=end&&(!closeD||closeD>end)){total++;const g=String(r["性別"]||"").trim();if(g==="男")male++;else if(g==="女")female++;}
    });
    return{month:ym,在案總數:total,新增:newCase,男:male,女:female};
  });
}

function computeStats(rows){
  const cms={},cr={},gender={},age={"60以下":0,"60-69":0,"70-79":0,"80-89":0,"90+":0},st={},dist={};
  rows.forEach(r=>{
    const s=String(r["服務狀態"]||"").trim()||"未知";st[s]=(st[s]||0)+1;
    const c=String(r["結案(暫停)原因"]||"").trim();if(c)cr[c]=(cr[c]||0)+1;
    if(s==="服務中"){
      const lv=parseCMS(r["CMS等級"])||"未知";cms[lv]=(cms[lv]||0)+1;
      const g=String(r["性別"]||"").trim()||"未知";gender[g]=(gender[g]||0)+1;
      const a=calcAge(r["生日"]);
      if(a!==null){if(a<60)age["60以下"]++;else if(a<70)age["60-69"]++;else if(a<80)age["70-79"]++;else if(a<90)age["80-89"]++;else age["90+"]++;}
      const d=String(r["通訊鄉鎮區"]||"").trim();if(d)dist[d]=(dist[d]||0)+1;
    }
  });
  const cmsData=Object.entries(cms).filter(([k])=>k!=="未知"&&k!=="").sort((a,b)=>Number(a[0])-Number(b[0])).map(([n,v])=>({name:`第${n}級`,value:v}));
  const closeData=Object.entries(cr).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([n,v])=>({name:n,value:v}));
  const ageData=Object.entries(age).map(([n,v])=>({name:n,value:v}));
  const genderData=Object.entries(gender).map(([n,v])=>({name:n,value:v}));
  const distData=Object.entries(dist).sort((a,b)=>b[1]-a[1]).map(([n,v])=>({name:n,value:v}));
  return{cmsData,closeData,ageData,genderData,distData,statusCount:st,cmsCount:cms};
}

// Chart.js 圖表元件
function ChartCanvas({type,data,options,h=280}){
  const ref=useRef();const chartRef=useRef();
  useEffect(()=>{
    if(!ref.current)return;
    if(chartRef.current)chartRef.current.destroy();
    chartRef.current=new Chart(ref.current,{type,data,options:{responsive:true,maintainAspectRatio:false,...options}});
    return()=>{if(chartRef.current)chartRef.current.destroy();};
  },[JSON.stringify(data)]);
  return React.createElement('div',{style:{height:h}},React.createElement('canvas',{ref}));
}

const COLORS=["#2563eb","#16a34a","#dc2626","#d97706","#7c3aed","#0891b2","#be185d","#65a30d"];

function App(){
  const [activeRows,setActiveRows]=useState(null);
  const [closedRows,setClosedRows]=useState(null);
  const [stats,setStats]=useState(null);
  const [trend,setTrend]=useState([]);
  const [serviceRows,setServiceRows]=useState(null);
  const [serviceStats,setServiceStats]=useState(null);
  const [activeNames,setActiveNames]=useState(new Set());
  const [closedNames,setClosedNames]=useState(new Set());
  const [activeRaw,setActiveRaw]=useState([]);
  const [showNewCases,setShowNewCases]=useState(false);
  const [showActive,setShowActive]=useState(false);
  const [showClosed,setShowClosed]=useState(false);
  const [closedRaw,setClosedRaw]=useState([]);
  const [fileNames,setFileNames]=useState({active:"",closed:"",service:""});
  const [tab,setTab]=useState("trend");


  const process=useCallback((aRows,cRows,aName,cName)=>{
    const all=[...aRows,...cRows];
    setActiveRows(aRows);setClosedRows(cRows);
    setStats(computeStats(all));setTrend(buildMonthlyActive(all));
setFileNames(p=>({...p,active:aName,closed:cName}));
  },[]);

  const onActive=useCallback(e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();r.onload=ev=>{
      const wb=XLSX.read(ev.target.result,{type:"array"});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const raw=XLSX.utils.sheet_to_json(ws,{defval:"",range:1});
      setActiveNames(new Set(raw.map(r=>normN(r["姓名"]||"")).filter(Boolean)));
      setActiveRaw(raw);
      process(anonymize(raw),closedRows||[],f.name,fileNames.closed);
    };r.readAsArrayBuffer(f);
  },[closedRows,fileNames.closed,process]);

  const onClosed=useCallback(e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();r.onload=ev=>{
      const wb=XLSX.read(ev.target.result,{type:"array"});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const raw=XLSX.utils.sheet_to_json(ws,{defval:"",range:1});
      setClosedNames(new Set(raw.map(r=>normN(r["姓名"]||"")).filter(Boolean)));
      setClosedRaw(raw);
      process(activeRows||[],anonymize(raw),fileNames.active,f.name);
    };r.readAsArrayBuffer(f);
  },[activeRows,fileNames.active,process]);

  const onService=useCallback(e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();r.onload=ev=>{
      const wb=XLSX.read(ev.target.result,{type:"array"});
      const ws=wb.Sheets[wb.SheetNames[0]];
      let rows=XLSX.utils.sheet_to_json(ws,{defval:"",range:2});
      const k=rows.length>0?Object.keys(rows[0])[0]:"";
      if(!k||k.startsWith("__EMPTY"))rows=XLSX.utils.sheet_to_json(ws,{defval:"",range:1});
      setServiceRows(rows);setServiceStats(computeServiceStats(rows));
      setFileNames(p=>({...p,service:f.name}));
    };r.readAsArrayBuffer(f);
  },[]);

  const dataMonth=useMemo(()=>{
    const all=[...(activeRows||[]),...(closedRows||[])];
    let latest=null;
    all.forEach(r=>{const d=parseDate(r["開案日期"]);if(d&&(!latest||d>latest))latest=d;});
    if(!latest)return null;
    return`${latest.getFullYear()}年${latest.getMonth()+1}月`;
  },[activeRows,closedRows]);

  const onAnalyze=async()=>{
    if(!stats)return;setLoading(true);setAiResult("");
    const last6=trend.slice(-6);
    const summary=`【芳心居家長照個案統計摘要（已去識別化）】
總在案：${activeNames.size} 累積結案：${closedNames.size}
CMS：${Object.entries(stats.cmsCount).filter(([k])=>k&&k!=="未知").map(([k,v])=>`第${k}級:${v}人`).join("、")}
近6月：${last6.map(m=>`${m.month}在案${m.在案總數}(男${m.男}/女${m.女})新增${m.新增}`).join(" | ")}
結案原因：${stats.closeData.slice(0,5).map(d=>`${d.name}:${d.value}`).join("、")}
年齡：${stats.ageData.map(d=>`${d.name}:${d.value}`).join("、")}`;
    try{
      const resp=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{"Content-Type":"application/json","anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,
          system:"你是長期照顧機構數據分析顧問，用繁體中文回答，條理清晰並提供具體建議。",
          messages:[{role:"user",content:`統計摘要（已去識別化）：\n${summary}\n\n請回答：${question}`}]})
      });
      const data=await resp.json();
      setAiResult(data.content?.find(b=>b.type==="text")?.text||"分析失敗");
    }catch(err){setAiResult("❌ "+err.message);}
    setLoading(false);
  };

  const card=(label,value,color)=>React.createElement('div',{style:{background:"white",borderRadius:10,padding:16,border:"1px solid #e2e8f0"}},
    React.createElement('div',{style:{fontSize:12,color:"#64748b",marginBottom:6}},label),
    React.createElement('div',{style:{fontSize:26,fontWeight:700,color}},value)
  );

  const uploadBox=(label,onChange,name,count)=>React.createElement('div',{style:{background:"white",borderRadius:12,padding:20,border:"1px solid #e2e8f0"}},
    React.createElement('div',{style:{fontWeight:600,marginBottom:10,fontSize:14}},label),
    React.createElement('label',{style:{cursor:"pointer",display:"block"}},
      React.createElement('div',{style:{background:name?"#dcfce7":"#eff6ff",border:`2px dashed ${name?"#16a34a":"#93c5fd"}`,borderRadius:8,padding:14,textAlign:"center",fontSize:13,color:name?"#16a34a":"#2563eb"}},
        name?`✅ ${name}（${count}筆）`:"點擊上傳"),
      React.createElement('input',{type:"file",accept:".xls,.xlsx",style:{display:"none"},onChange,onClick:e=>{e.target.value=null;}})
    )
  );

  return React.createElement('div',{style:{fontFamily:"inherit",background:"#f8fafc",minHeight:"100vh"}},
    // Header
    React.createElement('div',{style:{background:"linear-gradient(135deg,#1e40af,#1d4ed8)",padding:"24px 32px",color:"white"}},
      React.createElement('div',{style:{fontSize:22,fontWeight:700}},"📊 芳心居家 個案數據分析"),
      React.createElement('div',{style:{fontSize:13,opacity:.8,marginTop:4}},"本地去識別化 → 僅統計數據傳 AI，個資不離機")
    ),
    React.createElement('div',{style:{maxWidth:1100,margin:"0 auto",padding:"24px 16px"}},
      // Upload
      React.createElement('div',{style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12,marginBottom:20}},
        uploadBox("① 在案個案 XLS",onActive,fileNames.active,activeRows?.length),
        uploadBox("② 結案個案 XLS",onClosed,fileNames.closed,closedRows?.length),
        uploadBox("③ 當月服務明細 XLS",onService,fileNames.service,serviceRows?.length)
      ),

      // KPI + Charts
      stats&&React.createElement(React.Fragment,null,
        dataMonth&&React.createElement('div',{style:{marginBottom:8,fontSize:13,color:"#2563eb",fontWeight:600}},`📅 資料月份：${dataMonth}`),
        React.createElement('div',{style:{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12,marginBottom:20}},
          React.createElement('div',{style:{background:"white",borderRadius:10,padding:16,border:"1px solid #e2e8f0",cursor:"pointer"},onClick:()=>setShowActive(v=>!v)},
            React.createElement('div',{style:{fontSize:12,color:"#64748b",marginBottom:6}},"總個案數（不含結案） "+(showActive?"▲":"▼")),
            React.createElement('div',{style:{fontSize:26,fontWeight:700,color:"#2563eb"}},activeNames.size||0)
          ),
          React.createElement('div',{style:{background:"white",borderRadius:10,padding:16,border:"1px solid #e2e8f0",cursor:"pointer"},onClick:()=>setShowClosed(v=>!v)},
            React.createElement('div',{style:{fontSize:12,color:"#64748b",marginBottom:6}},"累積結案數（至今） "+(showClosed?"▲":"▼")),
            React.createElement('div',{style:{fontSize:26,fontWeight:700,color:"#dc2626"}},closedNames.size||0)
          ),
          React.createElement('div',{style:{background:"white",borderRadius:10,padding:16,border:"1px solid #e2e8f0",cursor:"pointer"},onClick:()=>setShowNewCases(v=>!v)},
            React.createElement('div',{style:{fontSize:12,color:"#64748b",marginBottom:6}},"本月新增 "+(showNewCases?"▲":"▼")),
            React.createElement('div',{style:{fontSize:26,fontWeight:700,color:"#16a34a"}},trend.length>0?trend[trend.length-1].新增:0)
          )
        ),

        showActive&&(()=>{
          const cases=activeRaw;
          return React.createElement('div',{style:{background:"white",borderRadius:12,border:"1px solid #e2e8f0",marginBottom:20,padding:20}},
            React.createElement('div',{style:{fontWeight:600,fontSize:14,marginBottom:12,color:"#2563eb"}},"📋 在案個案清單（"+cases.length+"人）"),
            React.createElement('table',{style:{width:"100%",borderCollapse:"collapse",fontSize:13}},
              React.createElement('thead',null,React.createElement('tr',{style:{background:"#f8fafc"}},
                ...["姓名","性別","CMS等級","年齡","鄉鎮區"].map(h=>React.createElement('th',{key:h,style:{padding:"8px 12px",textAlign:"center",borderBottom:"1px solid #e2e8f0",color:"#475569",fontWeight:600}},h))
              )),
              React.createElement('tbody',null,...cases.map((r,i)=>{
                const age=calcAge(r["生日"]);
                return React.createElement('tr',{key:i,style:{borderBottom:"1px solid #f1f5f9"}},
                  React.createElement('td',{style:{padding:"8px 12px",textAlign:"center",fontWeight:600}},r["姓名"]||"-"),
                  React.createElement('td',{style:{padding:"8px 12px",textAlign:"center"}},r["性別"]||"-"),
                  React.createElement('td',{style:{padding:"8px 12px",textAlign:"center"}},r["CMS等級"]||"-"),
                  React.createElement('td',{style:{padding:"8px 12px",textAlign:"center"}},age?age+"歲":"-"),
                  React.createElement('td',{style:{padding:"8px 12px",textAlign:"center"}},r["通訊鄉鎮區"]||"-")
                );
              }))
            )
          );
        })(),

        showClosed&&(()=>{
          const cases=closedRaw;
          return React.createElement('div',{style:{background:"white",borderRadius:12,border:"1px solid #e2e8f0",marginBottom:20,padding:20}},
            React.createElement('div',{style:{fontWeight:600,fontSize:14,marginBottom:12,color:"#dc2626"}},"📋 結案個案清單（"+cases.length+"人）"),
            React.createElement('table',{style:{width:"100%",borderCollapse:"collapse",fontSize:13}},
              React.createElement('thead',null,React.createElement('tr',{style:{background:"#f8fafc"}},
                ...["姓名","性別","CMS等級","年齡","鄉鎮區","結案日期","結案原因"].map(h=>React.createElement('th',{key:h,style:{padding:"8px 12px",textAlign:"center",borderBottom:"1px solid #e2e8f0",color:"#475569",fontWeight:600}},h))
              )),
              React.createElement('tbody',null,...cases.map((r,i)=>{
                const age=calcAge(r["生日"]);
                return React.createElement('tr',{key:i,style:{borderBottom:"1px solid #f1f5f9"}},
                  React.createElement('td',{style:{padding:"8px 12px",textAlign:"center",fontWeight:600}},r["姓名"]||"-"),
                  React.createElement('td',{style:{padding:"8px 12px",textAlign:"center"}},r["性別"]||"-"),
                  React.createElement('td',{style:{padding:"8px 12px",textAlign:"center"}},r["CMS等級"]||"-"),
                  React.createElement('td',{style:{padding:"8px 12px",textAlign:"center"}},age?age+"歲":"-"),
                  React.createElement('td',{style:{padding:"8px 12px",textAlign:"center"}},r["通訊鄉鎮區"]||"-"),
                  React.createElement('td',{style:{padding:"8px 12px",textAlign:"center"}},String(r["結束(暫停)服務日期"]||"").slice(0,10)||"-"),
                  React.createElement('td',{style:{padding:"8px 12px",textAlign:"center"}},r["結案(暫停)原因"]||"-")
                );
              }))
            )
          );
        })(),

        showNewCases&&(()=>{
          const lastM=trend.length>0?trend[trend.length-1].month:null;
          if(!lastM)return null;
          const newCases=activeRaw.filter(r=>{
            const d=parseDate(r["開案日期"]);
            return d&&(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"))===lastM;
          });
          return React.createElement('div',{style:{background:"white",borderRadius:12,border:"1px solid #bbf7d0",marginBottom:20,padding:20}},
            React.createElement('div',{style:{fontWeight:600,fontSize:14,marginBottom:12,color:"#16a34a"}},"📋 "+lastM+" 新增個案（"+newCases.length+"人）"),
            React.createElement('table',{style:{width:"100%",borderCollapse:"collapse",fontSize:13}},
              React.createElement('thead',null,React.createElement('tr',{style:{background:"#f8fafc"}},
                ...["姓名","開案日期","性別","CMS等級","年齡","鄉鎮區"].map(h=>React.createElement('th',{key:h,style:{padding:"8px 12px",textAlign:"center",borderBottom:"1px solid #e2e8f0",color:"#475569",fontWeight:600}},h))
              )),
              React.createElement('tbody',null,...newCases.map((r,i)=>{
                const age=calcAge(r["生日"]);
                return React.createElement('tr',{key:i,style:{borderBottom:"1px solid #f1f5f9"}},
                  React.createElement('td',{style:{padding:"8px 12px",textAlign:"center",fontWeight:600}},r["姓名"]||"-"),
                  React.createElement('td',{style:{padding:"8px 12px",textAlign:"center"}},String(r["開案日期"]||"").slice(0,10)),
                  React.createElement('td',{style:{padding:"8px 12px",textAlign:"center"}},r["性別"]||"-"),
                  React.createElement('td',{style:{padding:"8px 12px",textAlign:"center"}},r["CMS等級"]||"-"),
                  React.createElement('td',{style:{padding:"8px 12px",textAlign:"center"}},age?age+"歲":"-"),
                  React.createElement('td',{style:{padding:"8px 12px",textAlign:"center"}},r["通訊鄉鎮區"]||"-")
                );
              }))
            )
          );
        })(),

        // Tabs
        React.createElement('div',{style:{background:"white",borderRadius:12,border:"1px solid #e2e8f0",marginBottom:20}},
          React.createElement('div',{style:{display:"flex",borderBottom:"1px solid #e2e8f0",padding:"0 16px",overflowX:"auto"}},
            [["trend","📈 月趨勢"],["closetrend","📉 結案趨勢"],["cms","🏷 CMS"],["close","📋 結案原因"],["demo","👥 人口"],["district","📍 地區"]].map(([k,l])=>
              React.createElement('button',{key:k,onClick:()=>setTab(k),style:{padding:"12px 14px",border:"none",background:"none",cursor:"pointer",fontWeight:tab===k?700:400,color:tab===k?"#2563eb":"#64748b",borderBottom:tab===k?"2px solid #2563eb":"2px solid transparent",fontSize:13,whiteSpace:"nowrap"}},l)
            )
          ),
          React.createElement('div',{style:{padding:20}},
            tab==="trend"&&(trend.length===0
              ?React.createElement('div',{style:{color:"#94a3b8",textAlign:"center",padding:40}},"無日期資料")
              :React.createElement(React.Fragment,null,
                React.createElement(ChartCanvas,{type:"bar",h:300,
                  data:{
                    labels:trend.map(d=>d.month),
                    datasets:[
                      {type:"line",label:"月底在案總數",data:trend.map(d=>d.在案總數),borderColor:"#1d4ed8",backgroundColor:"transparent",borderWidth:3,yAxisID:"y",tension:0.3},
                      {type:"line",label:"男",data:trend.map(d=>d.男),borderColor:"#0891b2",backgroundColor:"transparent",borderWidth:2,yAxisID:"y",borderDash:[5,5],tension:0.3},
                      {type:"line",label:"女",data:trend.map(d=>d.女),borderColor:"#be185d",backgroundColor:"transparent",borderWidth:2,yAxisID:"y",borderDash:[5,5],tension:0.3},
                      {type:"bar",label:"當月新增",data:trend.map(d=>d.新增),backgroundColor:"rgba(147,197,253,0.7)",yAxisID:"y1"}
                    ]
                  },
                  options:{scales:{y:{position:"left"},y1:{position:"right",grid:{drawOnChartArea:false}}},plugins:{legend:{position:"bottom"}}}
                }),
                React.createElement('div',{style:{marginTop:16,overflowX:"auto"}},
                  React.createElement('table',{style:{width:"100%",borderCollapse:"collapse",fontSize:12}},
                    React.createElement('thead',null,React.createElement('tr',{style:{background:"#f8fafc"}},...["月份","在案總數","男","女","男女比","當月新增"].map(h=>React.createElement('th',{key:h,style:{padding:"8px 12px",textAlign:"center",borderBottom:"1px solid #e2e8f0",color:"#475569",fontWeight:600}},h)))),
                    React.createElement('tbody',null,...[...trend].reverse().map((r,i)=>React.createElement('tr',{key:i,style:{borderBottom:"1px solid #f1f5f9"}},
                      React.createElement('td',{style:{padding:"8px 12px",textAlign:"center",fontWeight:600}},r.month),
                      React.createElement('td',{style:{padding:"8px 12px",textAlign:"center",color:"#1d4ed8",fontWeight:700}},r.在案總數),
                      React.createElement('td',{style:{padding:"8px 12px",textAlign:"center",color:"#0891b2"}},r.男),
                      React.createElement('td',{style:{padding:"8px 12px",textAlign:"center",color:"#be185d"}},r.女),
                      React.createElement('td',{style:{padding:"8px 12px",textAlign:"center",color:"#64748b"}},r.在案總數>0?`${Math.round(r.男/r.在案總數*100)}%/${Math.round(r.女/r.在案總數*100)}%`:"-"),
                      React.createElement('td',{style:{padding:"8px 12px",textAlign:"center",color:"#16a34a"}},r.新增)
                    )))
                  )
                )
              )
            ),

            tab==="closetrend"&&(()=>{
              const cb={};(closedRows||[]).forEach(r=>{const m=toYM(parseDate(r["結束(暫停)服務日期"]))||toYM(parseDate(r["開案日期"]));if(m)cb[m]=(cb[m]||0)+1;});
              let acc=0;const cd=Object.keys(cb).sort().map(m=>{acc+=cb[m];return{month:m,當月結案:cb[m],累積結案:acc};});
              return cd.length===0
                ?React.createElement('div',{style:{color:"#94a3b8",textAlign:"center",padding:40}},"無結案資料")
                :React.createElement(ChartCanvas,{type:"bar",h:300,
                    data:{labels:cd.map(d=>d.month),datasets:[
                      {type:"bar",label:"當月結案",data:cd.map(d=>d.當月結案),backgroundColor:"rgba(252,165,165,0.8)",yAxisID:"y"},
                      {type:"line",label:"累積結案",data:cd.map(d=>d.累積結案),borderColor:"#dc2626",backgroundColor:"transparent",borderWidth:2.5,yAxisID:"y1",tension:0.3}
                    ]},
                    options:{scales:{y:{position:"left"},y1:{position:"right",grid:{drawOnChartArea:false}}},plugins:{legend:{position:"bottom"}}}
                  });
            })(),

            tab==="cms"&&(stats.cmsData.length===0
              ?React.createElement('div',{style:{color:"#94a3b8",textAlign:"center",padding:40}},"無CMS等級資料")
              :React.createElement(ChartCanvas,{type:"bar",
                data:{labels:stats.cmsData.map(d=>d.name),datasets:[{label:"人數",data:stats.cmsData.map(d=>d.value),backgroundColor:COLORS}]},
                options:{plugins:{legend:{display:false}}}
              })
            ),

            tab==="close"&&(stats.closeData.length===0
              ?React.createElement('div',{style:{color:"#94a3b8",textAlign:"center",padding:40}},"無結案資料")
              :React.createElement(ChartCanvas,{type:"bar",h:320,
                data:{labels:stats.closeData.map(d=>d.name),datasets:[{label:"件數",data:stats.closeData.map(d=>d.value),backgroundColor:"#7c3aed"}]},
                options:{indexAxis:"y",plugins:{legend:{display:false}}}
              })
            ),

            tab==="demo"&&React.createElement('div',{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:20}},
              React.createElement('div',null,
                React.createElement('div',{style:{fontWeight:600,marginBottom:10,fontSize:13}},"年齡分佈（服務中）"),
                React.createElement(ChartCanvas,{type:"bar",h:200,
                  data:{labels:stats.ageData.map(d=>d.name),datasets:[{label:"人數",data:stats.ageData.map(d=>d.value),backgroundColor:"#0891b2"}]},
                  options:{plugins:{legend:{display:false}}}
                })
              ),
              React.createElement('div',null,
                React.createElement('div',{style:{fontWeight:600,marginBottom:10,fontSize:13}},"性別分佈（服務中）"),
                React.createElement(ChartCanvas,{type:"doughnut",h:200,
                  data:{labels:stats.genderData.map(d=>d.name),datasets:[{data:stats.genderData.map(d=>d.value),backgroundColor:COLORS}]},
                  options:{plugins:{legend:{position:"bottom"}}}
                })
              )
            ),

            tab==="district"&&(stats.distData.length===0
              ?React.createElement('div',{style:{color:"#94a3b8",textAlign:"center",padding:40}},"無地區資料")
              :React.createElement(ChartCanvas,{type:"bar",
                data:{labels:stats.distData.map(d=>d.name),datasets:[{label:"人數",data:stats.distData.map(d=>d.value),backgroundColor:"#d97706"}]},
                options:{plugins:{legend:{display:false}}}
              })
            )
          )
        ),


      ),

      // 服務人次
      serviceStats&&React.createElement('div',{style:{background:"white",borderRadius:12,border:"1px solid #e2e8f0",marginTop:20}},
        React.createElement('div',{style:{borderBottom:"1px solid #e2e8f0",padding:"16px 20px",fontWeight:700,fontSize:15}},
          "🗓 服務人次統計 ",React.createElement('span',{style:{fontSize:12,color:"#64748b",fontWeight:400}},fileNames.service)
        ),
        React.createElement('div',{style:{padding:20}},
          activeNames.size>0&&serviceRows&&(()=>{
            const sNames=new Set(serviceRows.map(r=>normN(String(r["服務個案"]||""))).filter(Boolean));
            const notService=[...activeNames].filter(n=>!sNames.has(n));
            const notActive=[...sNames].filter(n=>![...activeNames].some(a=>normN(a)===n));
            return React.createElement('div',{style:{marginBottom:20,background:"#fefce8",border:"1px solid #fde68a",borderRadius:8,padding:16}},
              React.createElement('div',{style:{fontWeight:600,fontSize:13,marginBottom:10,color:"#92400e"}},"🔍 個案姓名比對（本地運算，資料不外傳）"),
              React.createElement('div',{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}},
                React.createElement('div',null,
                  React.createElement('div',{style:{fontSize:12,fontWeight:600,color:"#dc2626",marginBottom:6}},`在案但當月無服務紀錄（${notService.length}人）`),
                  notService.length===0
                    ?React.createElement('div',{style:{fontSize:12,color:"#16a34a"}},"✅ 所有在案個案均有服務紀錄")
                    :React.createElement('div',{style:{fontSize:12,lineHeight:1.8}},
                        ...notService.map((n,i)=>React.createElement('span',{key:i,style:{display:"inline-block",background:"#fee2e2",borderRadius:4,padding:"2px 8px",margin:"2px",color:"#dc2626"}},n))
                      )
                ),
                React.createElement('div',null,
                  React.createElement('div',{style:{fontSize:12,fontWeight:600,color:"#d97706",marginBottom:6}},`服務明細有但不在在案名單（${notActive.length}人）`),
                  notActive.length===0
                    ?React.createElement('div',{style:{fontSize:12,color:"#16a34a"}},"✅ 無異常")
                    :React.createElement('div',{style:{fontSize:12,lineHeight:1.8}},
                        ...notActive.map((n,i)=>React.createElement('span',{key:i,style:{display:"inline-block",background:"#fef3c7",borderRadius:4,padding:"2px 8px",margin:"2px",color:"#d97706"}},n))
                      )
                )
              )
            );
          })(),
          React.createElement('div',{style:{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,marginBottom:20}},
            ...[
              {label:"總服務人次",value:`${serviceStats.total} 次`,color:"#1d4ed8"},
              {label:"服務總個案數",value:`${serviceStats.totalCases} 人`,color:"#7c3aed"},
              {label:"女性人次/個案",value:`${serviceStats.female.days}次/${serviceStats.female.cases}人`,color:"#be185d"},
              {label:"男性人次/個案",value:`${serviceStats.male.days}次/${serviceStats.male.cases}人`,color:"#0891b2"},
            ].map((k,i)=>React.createElement('div',{key:i,style:{background:"#f8fafc",borderRadius:10,padding:16,border:"1px solid #e2e8f0",textAlign:"center"}},
              React.createElement('div',{style:{fontSize:12,color:"#64748b",marginBottom:6}},k.label),
              React.createElement('div',{style:{fontSize:18,fontWeight:700,color:k.color}},k.value)
            ))
          ),
          React.createElement('table',{style:{width:"100%",borderCollapse:"collapse",fontSize:13}},
            React.createElement('thead',null,React.createElement('tr',{style:{background:"#f1f5f9"}},
              ...["性別","服務人次","服務個案數","佔總人次%"].map(h=>React.createElement('th',{key:h,style:{padding:"10px 16px",textAlign:"center",borderBottom:"2px solid #e2e8f0",fontWeight:600,color:"#475569"}},h))
            )),
            React.createElement('tbody',null,
              ...[{g:"女性 (F)",days:serviceStats.female.days,cases:serviceStats.female.cases,color:"#be185d"},{g:"男性 (M)",days:serviceStats.male.days,cases:serviceStats.male.cases,color:"#0891b2"}].map((r,i)=>
                React.createElement('tr',{key:i,style:{borderBottom:"1px solid #f1f5f9"}},
                  React.createElement('td',{style:{padding:"12px 16px",textAlign:"center",fontWeight:700,color:r.color}},r.g),
                  React.createElement('td',{style:{padding:"12px 16px",textAlign:"center",fontSize:18,fontWeight:700}},`${r.days} 次`),
                  React.createElement('td',{style:{padding:"12px 16px",textAlign:"center"}},`${r.cases} 人`),
                  React.createElement('td',{style:{padding:"12px 16px",textAlign:"center",color:"#64748b"}},serviceStats.total>0?`${Math.round(r.days/serviceStats.total*100)}%`:"-")
                )
              ),
              React.createElement('tr',{style:{background:"#f8fafc",fontWeight:700}},
                React.createElement('td',{style:{padding:"12px 16px",textAlign:"center"}},"合計"),
                React.createElement('td',{style:{padding:"12px 16px",textAlign:"center",fontSize:18,color:"#1d4ed8"}},`${serviceStats.total} 次`),
                React.createElement('td',{style:{padding:"12px 16px",textAlign:"center"}},`${serviceStats.totalCases} 人`),
                React.createElement('td',{style:{padding:"12px 16px",textAlign:"center"}},"100%")
              )
            )
          ),
          React.createElement(ChartCanvas,{type:"bar",h:200,
            data:{labels:["女性 (F)","男性 (M)"],datasets:[
              {label:"人次",data:[serviceStats.female.days,serviceStats.male.days],backgroundColor:["#be185d","#0891b2"]},
              {label:"個案數",data:[serviceStats.female.cases,serviceStats.male.cases],backgroundColor:["rgba(190,24,93,0.3)","rgba(8,145,178,0.3)"]}
            ]},
            options:{plugins:{legend:{position:"bottom"}}}
          })
        )
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
